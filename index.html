<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6fed"><link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png"><title>学習問題アプリ</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#1e2430;--muted:#667085;--border:#d8dee9;--accent:#2f6fed;--good:#147a3d;--bad:#b42318;--soft:#eef3ff;}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Yu Gothic UI",sans-serif}
.app{max-width:960px;margin:auto;padding:16px}.header,.card,.status{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:14px}
h1{margin:0 0 8px;font-size:clamp(24px,3vw,34px)}.sub,.small{color:var(--muted)}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.wide{grid-column:1/-1}select,button{width:100%;min-height:52px;border-radius:14px;border:1px solid var(--border);background:#fff;font-size:17px;padding:10px 14px}button{font-weight:800}
.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.secondary{background:var(--soft);color:#1849a9}.danger{color:#b42318}
.toggle{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;background:#fff;border:1px solid var(--border);border-radius:14px;font-weight:700}.toggle input{width:24px;height:24px}
.notice{background:#fff8e6;border:1px solid #f4d38a;border-radius:14px;padding:12px 14px;margin-bottom:14px}.statusrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:800}
.progress{height:14px;background:#e8ecf3;border-radius:999px;overflow:hidden;margin-top:12px}.progress>div{height:100%;background:var(--accent);width:0}
.qhead{color:var(--accent);font-weight:800;font-size:18px;margin-bottom:12px}.question{white-space:pre-wrap;font-size:clamp(19px,2.4vw,24px);line-height:1.65}
.options{display:grid;grid-template-columns:1fr;gap:12px;margin-top:18px}.option{display:flex;gap:12px;border:2px solid var(--border);border-radius:16px;padding:16px;font-size:19px;line-height:1.45}.option input{width:26px;height:26px;flex:0 0 auto}.option.selected{border-color:var(--accent);background:var(--soft)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}.result{font-size:22px;font-weight:900;margin-bottom:10px}.good{color:var(--good)}.bad{color:var(--bad)}.explanation{white-space:pre-wrap;font-size:18px;line-height:1.7}
.dashboard{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.daybox{background:#fafbfc;border:1px solid var(--border);border-radius:14px;padding:12px;text-align:center}.mastered{color:var(--good);font-weight:800}
.install{display:none;background:#eef3ff;border:1px solid #b9cdfc;border-radius:14px;padding:12px 14px;margin-bottom:14px}
@media(min-width:700px){.two-col{grid-template-columns:1fr 1fr}}@media(max-width:700px){.controls,.actions{grid-template-columns:1fr}.wide{grid-column:auto}.dashboard{grid-template-columns:repeat(2,1fr)}.app{padding:12px}}
</style></head><body><div class="app">
<div class="install" id="installBox"><strong>ホーム画面にインストールできます</strong><div class="small">アプリのように単独画面で起動できます。</div><button class="primary" id="installBtn">アプリをインストール</button></div>
<section class="header"><h1><span id="courseTitle">学習問題アプリ</span><br><span id="courseSubtitle">問題を読み込み中...</span></h1><div class="sub">PWA版 v1.1・外部JSON教材・オフライン対応・学習履歴保存</div>
<div class="controls"><div><label>出題範囲</label><select id="mode"><option value="all">全問</option><option value="wrong">間違えた問題だけ</option><option value="uncleared">未クリア問題だけ</option></select></div>
<label class="toggle"><input type="checkbox" id="shuffle">問題順をシャッフル</label>
<button class="primary wide" id="restart">開始／やり直し</button><button class="secondary" id="dashBtn">学習状況を見る</button><button class="danger" id="resetBtn">学習履歴をリセット</button></div></section>
<div class="notice" id="notice">教材データを読み込んでいます...</div>
<section class="status"><div class="statusrow"><div id="progressText">-</div><div id="scoreText">現在の成績：0 / 0</div></div><div class="progress"><div id="bar"></div></div></section>
<section class="card" id="quizCard"><div class="qhead" id="qhead"></div><div class="question" id="question"></div><div class="options" id="options"></div></section>
<section class="card" id="feedback" style="display:none"><div class="result" id="result"></div><div class="explanation" id="explanation"></div></section>
<div class="actions" id="actions"><button class="primary" id="answerBtn">回答する</button><button id="nextBtn" disabled>次の問題</button></div>
<section class="card" id="dash" style="display:none"><div class="qhead">学習状況</div><div class="small" id="dashHelp" style="margin-bottom:12px">履歴はこの端末のブラウザ内に保存されます。</div><div class="dashboard" id="dashGrid"></div></section>
</div><script>
let COURSE={course_id:'default',title:'学習問題アプリ',subtitle:'',section_label:'区分',clear_count:3,questions:[]};
let QUESTIONS=[],KEY='learning_progress_default',active=[],current=0,correct=0,answered=0,locked=false,deferredPrompt=null;
const LEGACY_KEY='python_quiz_progress_v1';
const $=id=>document.getElementById(id), mode=$('mode'), shuffle=$('shuffle'), options=$('options');
function storageKey(){return 'learning_progress_'+String(COURSE.course_id||'default').replace(/[^a-zA-Z0-9_-]/g,'_')}
function loadP(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}}
function migrateLegacy(){if(COURSE.course_id==='python-basic-v1'&&!localStorage.getItem(KEY)){const old=localStorage.getItem(LEGACY_KEY);if(old)localStorage.setItem(KEY,old)}}
function stat(n){return loadP()[n]||{correct:0,wrong:0}}
function saveAns(n,ok){const p=loadP();if(!p[n])p[n]={correct:0,wrong:0};ok?p[n].correct++:p[n].wrong++;localStorage.setItem(KEY,JSON.stringify(p))}
function cleared(q){return stat(q.number).correct>=COURSE.clear_count}
function mix(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function sections(){return [...new Set(QUESTIONS.map(q=>q.day))].sort((a,b)=>String(a).localeCompare(String(b),'ja',{numeric:true}))}
function configureCourse(){
  document.title=COURSE.title||'学習問題アプリ';
  $('courseTitle').textContent=COURSE.title||'学習問題アプリ';
  $('courseSubtitle').textContent=COURSE.subtitle||'';
  KEY=storageKey();migrateLegacy();
  mode.innerHTML='<option value="all">全問</option>';
  for(const d of sections()){const o=document.createElement('option');o.value='section:'+d;o.textContent=`${COURSE.section_label} ${d}`;mode.append(o)}
  mode.insertAdjacentHTML('beforeend','<option value="wrong">間違えた問題だけ</option><option value="uncleared">未クリア問題だけ</option>');
  $('notice').textContent=`現在${QUESTIONS.length}問収録です。各問題は${COURSE.clear_count}回正解するとクリアになります。`;
  $('dashHelp').textContent=`${COURSE.clear_count}回正解でクリア。履歴はこの端末のブラウザ内に保存されます。`;
}
function start(){const v=mode.value;if(v==='all')active=[...QUESTIONS];else if(v==='wrong')active=QUESTIONS.filter(q=>stat(q.number).wrong>0);else if(v==='uncleared')active=QUESTIONS.filter(q=>!cleared(q));else if(v.startsWith('section:'))active=QUESTIONS.filter(q=>String(q.day)===v.slice(8));else active=[];if(shuffle.checked)active=mix(active);current=correct=answered=0;locked=false;$('dash').style.display='none';$('quizCard').style.display='block';$('actions').style.display='grid';if(!active.length){$('qhead').textContent='対象問題はありません';$('question').textContent=v==='wrong'?'まだ間違えた問題はありません。':'対象となる問題はありません。';options.innerHTML='';$('answerBtn').disabled=true;$('nextBtn').disabled=true;return}render()}
function render(){const q=active[current],s=stat(q.number);locked=false;$('feedback').style.display='none';$('qhead').textContent=`${COURSE.section_label} ${q.day}　問${q.number}【${q.type}】`;$('question').textContent=q.question+`\n\n［累計］正解 ${s.correct}回 / 不正解 ${s.wrong}回`+(cleared(q)?'　✓クリア':'');options.innerHTML='';q.options.forEach(([k,t])=>{const l=document.createElement('label');l.className='option';const r=document.createElement('input');r.type='radio';r.name='answer';r.value=k;r.onchange=()=>{document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));l.classList.add('selected')};const sp=document.createElement('span');sp.textContent=`${k}. ${t}`;l.append(r,sp);options.append(l)});options.classList.toggle('two-col',q.options.every(([,t])=>String(t).length<75));$('answerBtn').disabled=false;$('nextBtn').disabled=true;$('progressText').textContent=`${current+1} / ${active.length} 問　問${q.number}`;$('bar').style.width=`${current/active.length*100}%`;score()}
function answer(){if(locked)return;const sel=document.querySelector('input[name=answer]:checked');if(!sel)return alert('選択肢を1つ選んでください。');const q=active[current];answered++;locked=true;const ok=sel.value===q.answer;if(ok)correct++;saveAns(q.number,ok);$('result').textContent=ok?'正解です。':`不正解です。正解は ${q.answer} です。`;$('result').className='result '+(ok?'good':'bad');const s=stat(q.number),remain=Math.max(0,COURSE.clear_count-s.correct);$('explanation').textContent='解説：\n'+q.explanation+`\n\n累計：正解 ${s.correct}回 / 不正解 ${s.wrong}回`+(cleared(q)?'\n✓ この問題はクリア済みです。':`\nあと ${remain}回正解でクリアです。`);$('feedback').style.display='block';document.querySelectorAll('input[name=answer]').forEach(x=>x.disabled=true);$('answerBtn').disabled=true;$('nextBtn').disabled=false;$('bar').style.width=`${(current+1)/active.length*100}%`;score();$('feedback').scrollIntoView({behavior:'smooth',block:'nearest'})}
function next(){if(!locked)return;if(current+1>=active.length){alert(`終了しました。\n\n正解数: ${correct} / ${active.length}\n正答率: ${(correct/active.length*100).toFixed(1)}%`);showDash();return}current++;render()}
function score(){const r=answered?correct/answered*100:0;$('scoreText').textContent=`現在の成績：${correct} / ${answered} 正解（${r.toFixed(1)}%）`}
function showDash(){$('dash').style.display='block';$('quizCard').style.display='none';$('feedback').style.display='none';$('actions').style.display='none';const g=$('dashGrid');g.innerHTML='';for(const d of sections()){const qs=QUESTIONS.filter(q=>String(q.day)===String(d)),c=qs.filter(cleared).length,a=qs.filter(q=>{const s=stat(q.number);return s.correct+s.wrong>0}).length;const b=document.createElement('div');b.className='daybox';b.innerHTML=`<strong>${COURSE.section_label} ${d}</strong><div class="${c===qs.length&&qs.length?'mastered':''}">${c} / ${qs.length} クリア</div><div class="small">学習済み ${a}問</div>`;g.append(b)}}
$('restart').onclick=start;$('answerBtn').onclick=answer;$('nextBtn').onclick=next;$('dashBtn').onclick=showDash;$('resetBtn').onclick=()=>{if(confirm('この教材の学習履歴をすべて削除しますか？')){localStorage.removeItem(KEY);alert('学習履歴を削除しました。');start()}};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('installBox').style.display='block'});$('installBtn').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('installBox').style.display='none'};
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
async function loadCourse(){try{const r=await fetch('./questions.json',{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const data=await r.json();if(!data||!Array.isArray(data.questions)||!data.questions.length)throw new Error('questions が空です');COURSE={course_id:data.course_id||'default',title:data.title||'学習問題アプリ',subtitle:data.subtitle||'',section_label:data.section_label||'区分',clear_count:Number(data.clear_count)||3,questions:data.questions};QUESTIONS=COURSE.questions;configureCourse();start()}catch(e){$('notice').textContent='教材データ questions.json を読み込めませんでした。';$('qhead').textContent='読み込みエラー';$('question').textContent=String(e);$('answerBtn').disabled=true;$('nextBtn').disabled=true}}
loadCourse();
</script></body></html>
