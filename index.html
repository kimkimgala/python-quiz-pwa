<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6fed"><link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png"><title>Python基礎集中講座</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#1e2430;--muted:#667085;--border:#d8dee9;--accent:#2f6fed;--good:#147a3d;--bad:#b42318;--soft:#eef3ff;}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Yu Gothic UI",sans-serif}
.app{max-width:960px;margin:auto;padding:16px}.header,.card,.status{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:14px}
h1{margin:0 0 8px;font-size:clamp(24px,3vw,34px)}.sub,.small{color:var(--muted)}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.wide{grid-column:1/-1}select,button{width:100%;min-height:52px;border-radius:14px;border:1px solid var(--border);background:#fff;font-size:17px;padding:10px 14px}button{font-weight:800}
.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.secondary{background:var(--soft);color:#1849a9}.danger{color:#b42318}
.toggle{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;background:#fff;border:1px solid var(--border);border-radius:14px;font-weight:700}.toggle input{width:24px;height:24px}
.notice{background:#fff8e6;border:1px solid #f4d38a;border-radius:14px;padding:12px 14px;margin-bottom:14px}.statusrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:800}
.progress{height:14px;background:#e8ecf3;border-radius:999px;overflow:hidden;margin-top:12px}.progress>div{height:100%;background:var(--accent);width:0}
.qhead{color:var(--accent);font-weight:800;font-size:18px;margin-bottom:12px}.question{white-space:pre-wrap;font-size:clamp(19px,2.4vw,24px);line-height:1.65}
.options{display:grid;grid-template-columns:1fr;gap:12px;margin-top:18px}.option{display:flex;gap:12px;border:2px solid var(--border);border-radius:16px;padding:16px;font-size:19px;line-height:1.45}.option input{width:26px;height:26px;flex:0 0 auto}.option.selected{border-color:var(--accent);background:var(--soft)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}.result{font-size:22px;font-weight:900;margin-bottom:10px}.good{color:var(--good)}.bad{color:var(--bad)}.explanation{white-space:pre-wrap;font-size:18px;line-height:1.7}
.dashboard{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.daybox{background:#fafbfc;border:1px solid var(--border);border-radius:14px;padding:12px;text-align:center}.mastered{color:var(--good);font-weight:800}
.install{display:none;background:#eef3ff;border:1px solid #b9cdfc;border-radius:14px;padding:12px 14px;margin-bottom:14px}
@media(min-width:700px){.two-col{grid-template-columns:1fr 1fr}}@media(max-width:700px){.controls,.actions{grid-template-columns:1fr}.wide{grid-column:auto}.dashboard{grid-template-columns:repeat(2,1fr)}.app{padding:12px}}
</style></head><body><div class="app">
<div class="install" id="installBox"><strong>ホーム画面にインストールできます</strong><div class="small">アプリのように単独画面で起動できます。</div><button class="primary" id="installBtn">アプリをインストール</button></div>
<section class="header"><h1>Python基礎集中講座<br>模擬問題アプリ</h1><div class="sub">PWA版 v1.0・オフライン対応・学習履歴保存</div>
<div class="controls"><div><label>出題範囲</label><select id="mode"><option value="all">全問</option>
<option value="1">Day 1</option><option value="2">Day 2</option><option value="3">Day 3</option><option value="4">Day 4</option><option value="5">Day 5</option><option value="6">Day 6</option><option value="7">Day 7</option><option value="8">Day 8</option><option value="9">Day 9</option><option value="10">Day 10</option>
<option value="wrong">間違えた問題だけ</option><option value="uncleared">未クリア問題だけ</option></select></div>
<label class="toggle"><input type="checkbox" id="shuffle">問題順をシャッフル</label>
<button class="primary wide" id="restart">開始／やり直し</button><button class="secondary" id="dashBtn">学習状況を見る</button><button class="danger" id="resetBtn">学習履歴をリセット</button></div></section>
<div class="notice" id="notice">現在49問収録です。各問題は3回正解するとクリアになります。</div>
<section class="status"><div class="statusrow"><div id="progressText">-</div><div id="scoreText">現在の成績：0 / 0</div></div><div class="progress"><div id="bar"></div></div></section>
<section class="card" id="quizCard"><div class="qhead" id="qhead"></div><div class="question" id="question"></div><div class="options" id="options"></div></section>
<section class="card" id="feedback" style="display:none"><div class="result" id="result"></div><div class="explanation" id="explanation"></div></section>
<div class="actions" id="actions"><button class="primary" id="answerBtn">回答する</button><button id="nextBtn" disabled>次の問題</button></div>

</div><script>
const QUESTIONS=[{"day": 1, "number": 101, "type": "四者択一", "question": "Pythonの f-string の波括弧 {} 内には変数だけでなく計算式やメソッド呼び出しも記述できます。以下のコードを実行した際に出力される結果はどれか。\n\nmax_tokens = 500\nprint(f\"残りトークン数: {max_tokens - 120} / 大文字: {'system'.upper()}\")", "options": [["A", "残りトークン数: max_tokens - 120 / 大文字: 'system'.upper()"], ["B", "残りトークン数: 380 / 大文字: SYSTEM"], ["C", "構文エラー（SyntaxError）"], ["D", "残りトークン数: 380 / 大文字: 'system'"]], "answer": "B", "explanation": "f-string の {} 内には任意のPython式を記述できます。max_tokens - 120 の演算結果（380）や、文字列メソッド 'system'.upper() の実行結果（SYSTEM）が展開されます。"}, {"day": 1, "number": 102, "type": "四者択一", "question": "ユーザーからの入力文字列の前後に含まれる余分な空白文字や改行文字を取り除き、プロンプトのノイズを除去する文字列メソッドはどれか。", "options": [["A", ".clean()"], ["B", ".trim()"], ["C", ".strip()"], ["D", ".slice()"]], "answer": "C", "explanation": "Pythonでは文字列の先頭および末尾の空白文字（スペース、タブ、改行）を除去するために .strip() を使用します（他言語の trim() に相当）。"}, {"day": 1, "number": 103, "type": "四者択一", "question": "プロンプト内にプログラミングコードやJSON形式などの「波括弧（{ や }）」そのものを文字として記述したい場合、f-string 内で正しくエスケープする方法はどれか。", "options": [["A", "\\{ および \\}"], ["B", "{{ および }}"], ["C", "<{ および }>"], ["D", "%{ および %}"]], "answer": "B", "explanation": "f-string では、波括弧を二重（{{ や }}）に記述することで、変数展開の記号ではなくプレーンな波括弧文字として出力できます。"}, {"day": 1, "number": 104, "type": "四者択一", "question": "以下のコードを実行した際、コンソールに出力される文字列はどれか。\n\ndoc_list = [\"就業規則.pdf\", \"情報セキュリティ規程.pdf\", \"旅費規程.pdf\"]\nresult = \"\\n- \".join(doc_list)\nprint(f\"参照ファイル:\\n- {result}\")", "options": [["A", "参照ファイル: 就業規則.pdf, 情報セキュリティ規程.pdf, 旅費規程.pdf"], ["B", "参照ファイル:\\n- 就業規則.pdf\\n- 情報セキュリティ規程.pdf\\n- 旅費規程.pdf（改行されて箇条書き表示）"], ["C", "リスト全体が四角括弧付きで表示される"], ["D", "join の引数エラー"]], "answer": "B", "explanation": "区切り文字.join(リスト) を使用すると、リストの各要素を指定した区切り文字で連結できます。ここでは改行とハイフンで連結し、見やすい箇条書きプロンプトを構築しています。"}, {"day": 1, "number": 105, "type": "正誤判定", "question": "Pythonでは三重引用符（\"\"\" または '''）を使用することで、改行をそのまま保持した複数行（マルチライン）の文字列を定義できる。", "options": [["A", "正しい"], ["B", "誤り"]], "answer": "A", "explanation": "三重引用符を用いると、途中に改行を含んだ長大なシステムプロンプトや説明文をそのまま変数に格納できます。"}, {"day": 2, "number": 106, "type": "四者択一", "question": "辞書 config からキー \"temperature\" の値を取得する際、キーが存在しない場合にプログラムをクラッシュ（KeyError）させず、既定値 0.0 を安全に取得する記述はどれか。\n\nconfig = {\"model\": \"gpt-4o\"}", "options": [["A", "config[\"temperature\"]"], ["B", "config.get(\"temperature\", 0.0)"], ["C", "config.find(\"temperature\", 0.0)"], ["D", "config.default(\"temperature\", 0.0)"]], "answer": "B", "explanation": "辞書の .get(key, default) メソッドは、指定したキーが存在しない場合に第2引数で指定したデフォルト値を返却します。ブラケット記法では未存在時に KeyError が発生します。"}, {"day": 2, "number": 107, "type": "四者択一", "question": "以下の会話履歴リストから、「AIの最新の回答テキスト（\"前日17時までです。\"）」を取り出すコードとして適切なものはどれか。\n\nmessages = [\n    {\"role\": \"user\", \"content\": \"有給申請はいつまで？\"},\n    {\"role\": \"assistant\", \"content\": \"前日17時までです。\"}\n]", "options": [["A", "messages[1][\"content\"]"], ["B", "messages[-1][\"content\"]"], ["C", "AとBのどちらでも正しい"], ["D", "messages[\"assistant\"][\"content\"]"]], "answer": "C", "explanation": "リストの2番目の要素（インデックス 1）または末尾の要素（インデックス -1）を指定し、得られた辞書からキー \"content\" を取得します。AとBはいずれも同じ結果を返します。"}, {"day": 2, "number": 108, "type": "四者択一", "question": "既存のリスト chat_history の末尾に新しいメッセージ辞書を追加するメソッドはどれか。", "options": [["A", "chat_history.push({\"role\": \"user\", \"content\": \"こんにちは\"})"], ["B", "chat_history.append({\"role\": \"user\", \"content\": \"こんにちは\"})"], ["C", "chat_history.insert({\"role\": \"user\", \"content\": \"こんにちは\"})"], ["D", "chat_history.add({\"role\": \"user\", \"content\": \"こんにちは\"})"]], "answer": "B", "explanation": "Pythonのリストの末尾に単一の要素を追加するメソッドは .append() です。"}, {"day": 2, "number": 109, "type": "四者択一", "question": "以下のコードを実行した際に出力される値はどれか。\n\nuser_profile = {\"name\": \"山田\", \"role\": \"operator\"}\nuser_profile[\"role\"] = \"supervisor\"\nuser_profile[\"dept\"] = \"CS部\"\nprint(len(user_profile))", "options": [["A", "2"], ["B", "3"], ["C", "4"], ["D", "1"]], "answer": "B", "explanation": "既存のキー \"role\" は値が上書き更新され、存在しないキー \"dept\" は新規追加されます。結果としてキーは3個となり、len() は 3 を返します。"}, {"day": 2, "number": 110, "type": "正誤判定", "question": "Pythonのリストでは、要素として文字列、数値、真偽値、辞書、さらには別のリストを混在して格納することができる。", "options": [["A", "正しい"], ["B", "誤り"]], "answer": "A", "explanation": "Pythonのリストは動的配列であり、異なるデータ型を同一リスト内に自由に共存させることができます。"}, {"day": 3, "number": 111, "type": "四者択一", "question": "以下のコードを実行した際に出力される行数は何行か。\n\nlogs = [\"OK\", \"WARN\", \"SKIP\", \"ERROR\", \"SKIP\", \"INFO\"]\nfor log in logs:\n    if log == \"SKIP\":\n        continue\n    print(log)", "options": [["A", "6行"], ["B", "4行"], ["C", "2行"], ["D", "0行"]], "answer": "B", "explanation": "continue 文は、それ以降の処理をスキップして次のループイテレーションへ進みます。\"SKIP\" の2回がスキップされるため、残りの4要素が出力されます。"}, {"day": 3, "number": 112, "type": "四者択一", "question": "検索処理などで「対象が見つかった瞬間にループを完全に打ち切りたい」場合に使用するキーワードはどれか。", "options": [["A", "stop"], ["B", "exit"], ["C", "break"], ["D", "pass"]], "answer": "C", "explanation": "break 文は、現在実行中のループを即座に強制終了し、ループの外側の処理へ抜けます。"}, {"day": 3, "number": 113, "type": "四者択一", "question": "文字列やリスト内に特定の要素が含まれているかを真偽値（True/False）で判定する演算子はどれか。\n\nif \"解約\" ??? customer_message:\n    print(\"解約窓口へ誘導します\")", "options": [["A", "has"], ["B", "contains"], ["C", "in"], ["D", "exists"]], "answer": "C", "explanation": "Pythonでは 要素 in コレクション 演算子を用いて包含判定を行います。"}, {"day": 3, "number": 114, "type": "四者択一", "question": "ループ処理において、要素そのものと同時に「0から始まるインデックス番号（カウンター）」を同時に取得できる標準関数はどれか。\n\ndocs = [\"規程A\", \"規程B\", \"規程C\"]\nfor i, doc in ???(docs):\n    print(f\"[{i}] {doc}\")", "options": [["A", "enumerate"], ["B", "counter"], ["C", "indexed"], ["D", "range"]], "answer": "A", "explanation": "enumerate(iterable, start=0) を使用すると、(インデックス, 要素) のタプルが順次生成されます。"}, {"day": 3, "number": 115, "type": "四者択一", "question": "辞書 data のすべての「キー」と「値」のペアを同時に取り出してループ処理するメソッドはどれか。\n\ndata = {\"model\": \"gpt-4o\", \"temperature\": 0.2}\nfor k, v in data.???():\n    print(f\"{k} = {v}\")", "options": [["A", "pairs()"], ["B", "items()"], ["C", "elements()"], ["D", "all()"]], "answer": "B", "explanation": "辞書の .items() メソッドは、(キー, 値) のペアを反復可能なオブジェクトとして返します。"}, {"day": 4, "number": 116, "type": "四者択一", "question": "以下の関数 get_greeting において、return 文を記述しなかった場合、関数の戻り値として自動的に設定されるオブジェクトはどれか。\n\ndef get_greeting(name):\n    message = f\"こんにちは、{name}さん\"", "options": [["A", "空文字列 \"\""], ["B", "0"], ["C", "None"], ["D", "エラー（ReturnRequiredError）"]], "answer": "C", "explanation": "Pythonの関数は return 文を実行せずに終了した場合、または単に return とだけ記述した場合、戻り値として None を返します。"}, {"day": 4, "number": 117, "type": "四者択一", "question": "関数の呼び出しにおいて、引数名を明示して値を渡す「キーワード引数」の利用例として正しいものはどれか。\n\ndef generate_response(prompt, model=\"gpt-4o\", temperature=0.0):\n    pass", "options": [["A", "generate_response(\"要約して\", model=\"gpt-4o-mini\", temperature=0.5)"], ["B", "generate_response(model=\"gpt-4o\", \"要約して\")"], ["C", "generate_response(\"要約して\", \"gpt-4o-mini\", temp=0.5)"], ["D", "generate_response(prompt: \"要約して\")"]], "answer": "A", "explanation": "位置引数の後にキーワード引数を指定します。引数名は定義と一致させる必要があります。"}, {"day": 4, "number": 118, "type": "四者択一", "question": "関数の設計において、任意の個数のキーワード引数を辞書としてまとめて受け取るための特殊引数はどれか。", "options": [["A", "*args"], ["B", "**kwargs"], ["C", "&params"], ["D", "*dict"]], "answer": "B", "explanation": "アスタリスク2つを付けた **kwargs（Keyword Arguments）を定義すると、呼び出し時に渡された任意のキーワード引数が1つの辞書に格納されます。"}, {"day": 4, "number": 119, "type": "四者択一", "question": "Python初心者が陥りやすいアンチパターンとして知られる「デフォルト引数にミュータブル（変更可能）なオブジェクトを指定した問題」を示すコードはどれか。", "options": [["A", "def add_item(item, history=None):"], ["B", "def add_item(item, history=[]):"], ["C", "def add_item(item: str, count: int = 0):"], ["D", "def add_item(item: str, is_admin: bool = False):"]], "answer": "B", "explanation": "デフォルト引数のリスト（history=[]）は関数定義時に1度だけ生成され共有されるため、複数回の呼び出し間で中身が累積してしまうバグを引き起こします。既定値には None を指定し、関数内で初期化するのが定石です。"}, {"day": 4, "number": 120, "type": "正誤判定", "question": "関数の直下に記述する説明用文字列（Docstring）は三重引用符（\"\"\")で囲み、その関数の役割、引数、戻り値の説明を記載するのが推奨慣行である。", "options": [["A", "正しい"], ["B", "誤り"]], "answer": "A", "explanation": "関数定義の先頭行に記述されたDocstringは、開発環境（VS Code等）のホバー表示や help() 関数で参照されます。"}, {"day": 5, "number": 12 function cleared(q){return stat(q.number).correct>=3} function mix(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function start(){const v=mode.value;if(v==='all')active=[...QUESTIONS];else if(v==='wrong')active=QUESTIONS.filter(q=>stat(q.number).wrong>0);else if(v==='uncleared')active=QUESTIONS.filter(q=>!cleared(q));else active=QUESTIONS.filter(q=>String(q.day)===v);if(shuffle.checked)active=mix(active);current=correct=answered=0;locked=false;$('dash').style.display='none';$('quizCard').style.display='block';$('actions').style.display='grid';if(!active.length){$('qhead').textContent='対象問題はありません';$('question').textContent=v==='wrong'?'まだ間違えた問題はありません。':'対象となる問題はありません。';options.innerHTML='';$('answerBtn').disabled=true;$('nextBtn').disabled=true;return}render()}
function render(){const q=active[current],s=stat(q.number);locked=false;$('feedback').style.display='none';$('qhead').textContent=`Day ${q.day}　問${q.number}【${q.type}】`;$('question').textContent=q.question+`\n\n［累計］正解 ${s.correct}回 / 不正解 ${s.wrong}回`+(s.correct>=3?'　✓クリア':'');options.innerHTML='';q.options.forEach(([k,t])=>{const l=document.createElement('label');l.className='option';const r=document.createElement('input');r.type='radio';r.name='answer';r.value=k;r.onchange=()=>{document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));l.classList.add('selected')};const sp=document.createElement('span');sp.textContent=`${k}. ${t}`;l.append(r,sp);options.append(l)});options.classList.toggle('two-col',q.options.every(([,t])=>t.length<75));$('answerBtn').disabled=false;$('nextBtn').disabled=true;$('progressText').textContent=`${current+1} / ${active.length} 問　問${q.number}`;$('bar').style.width=`${current/active.length*100}%`;score()}
function answer(){if(locked)return;const sel=document.querySelector('input[name=answer]:checked');if(!sel)return alert('選択肢を1つ選んでください。');const q=active[current];answered++;locked=true;const ok=sel.value===q.answer;if(ok)correct++;saveAns(q.number,ok);$('result').textContent=ok?'正解です。':`不正解です。正解は ${q.answer} です。`;$('result').className='result '+(ok?'good':'bad');const s=stat(q.number);$('explanation').textContent='解説：\n'+q.explanation+`\n\n累計：正解 ${s.correct}回 / 不正解 ${s.wrong}回`+(s.correct>=3?'\n✓ この問題はクリア済みです。':`\nあと ${3-s.correct}回正解でクリアです。`);$('feedback').style.display='block';document.querySelectorAll('input[name=answer]').forEach(x=>x.disabled=true);$('answerBtn').disabled=true;$('nextBtn').disabled=false;$('bar').style.width=`${(current+1)/active.length*100}%`;score();$('feedback').scrollIntoView({behavior:'smooth',block:'nearest'})}
function next(){if(!locked)return;if(current+1>=active.length){alert(`終了しました。\n\n正解数: ${correct} / ${active.length}\n正答率: ${(correct/active.length*100).toFixed(1)}%`);showDash();return}current++;render()}
function score(){const r=answered?correct/answered*100:0;$('scoreText').textContent=`現在の成績：${correct} / ${answered} 正解（${r.toFixed(1)}%）`}
function showDash(){$('dash').style.display='block';$('quizCard').style.display='none';$('feedback').style.display='none';$('actions').style.display='none';const g=$('dashGrid');g.innerHTML='';for(let d=1;d<=10;d++){const qs=QUESTIONS.filter(q=>q.day===d),c=qs.filter(cleared).length,a=qs.filter(q=>{const s=stat(q.number);return s.correct+s.wrong>0}).length;const b=document.createElement('div');b.className='daybox';b.innerHTML=`<strong>Day ${d}</strong><div class="${c===qs.length&&qs.length?'mastered':''}">${c} / ${qs.length} クリア</div><div class="small">学習済み ${a}問</div>`;g.append(b)}}
$('restart').onclick=start;$('answerBtn').onclick=answer;$('nextBtn').onclick=next;$('dashBtn').onclick=showDash;$('resetBtn').onclick=()=>{if(confirm('学習履歴をすべて削除しますか？')){localStorage.removeItem(KEY);alert('学習履歴を削除しました。');start()}};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('installBox').style.display='block'});$('installBtn').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('installBox').style.display='none'};
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
start();
</script></body></html>
