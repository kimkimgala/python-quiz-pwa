<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<title>教材作成アシスタント v1.6</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#1e2430;--muted:#667085;--border:#d8dee9;--accent:#2f6fed;--good:#147a3d;--bad:#b42318;--soft:#eef3ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Yu Gothic UI",sans-serif}.app{max-width:980px;margin:auto;padding:16px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:14px}h1{margin:0 0 8px;font-size:clamp(25px,3vw,34px)}h2{margin:0 0 14px}.sub,.small{color:var(--muted)}label{display:block;font-weight:800;margin:12px 0 6px}input,textarea,select,button{width:100%;border:1px solid var(--border);border-radius:12px;background:#fff;font:inherit;padding:11px 12px}textarea{min-height:92px;resize:vertical}button{min-height:48px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.secondary{background:var(--soft);color:#1849a9}.danger{color:var(--bad)}.good{color:var(--good)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.question-card{border:1px solid var(--border);border-radius:16px;padding:16px;margin-top:14px}.question-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.question-head button{width:auto;min-width:110px}.option-row{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:end}.notice{border-radius:14px;padding:12px 14px;margin:12px 0;background:#fff8e6;border:1px solid #f4d38a}.notice.ok{background:#edf9f0;border-color:#b7dfc3}.notice.error{background:#fff0ef;border-color:#efb5b0}.preview{white-space:pre;overflow:auto;max-height:420px;background:#111827;color:#f9fafb;border-radius:14px;padding:14px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px}.topbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.topbar a{color:#1849a9;font-weight:800;text-decoration:none}.pill{display:inline-block;background:var(--soft);color:#1849a9;border-radius:999px;padding:5px 10px;font-weight:800}.hidden{display:none}@media(max-width:720px){.grid2,.grid4,.actions{grid-template-columns:1fr}.option-row{grid-template-columns:54px 1fr}.question-head{align-items:flex-start;flex-direction:column}.question-head button{width:100%}}
</style>
</head>
<body><main class="app">
<div class="topbar"><a href="./">← 学習アプリへ戻る</a><span class="pill">v1.6</span></div>
<section class="card"><h1>教材作成アシスタント</h1><div class="sub">フォームへ入力すると、v1.5の自動登録機能で利用できる教材JSONを作成できます。入力内容はこのブラウザ内だけで処理し、サーバーへ送信しません。</div></section>
<section class="card"><h2>1. 教材情報</h2><div class="grid2"><div><label for="courseId">教材ID</label><input id="courseId" placeholder="例: accounting-basic-v1"><div class="small">英数字・ハイフン・アンダースコア。後から変更しない識別子です。</div></div><div><label for="title">教材名</label><input id="title" placeholder="例: 会計基礎"></div></div><label for="description">教材の説明</label><textarea id="description" placeholder="教材一覧に表示する説明"></textarea><div class="grid4"><div><label for="subtitle">サブタイトル</label><input id="subtitle" placeholder="基礎編"></div><div><label for="sectionLabel">区分名</label><input id="sectionLabel" value="章"></div><div><label for="clearCount">クリア回数</label><input id="clearCount" type="number" min="1" step="1" value="3"></div><div><label for="startNumber">開始番号</label><input id="startNumber" type="number" step="1" value="1"></div></div></section>
<section class="card"><div class="question-head"><h2>2. 問題</h2><button type="button" class="secondary" id="addQuestionBtn">＋ 問題を追加</button></div><div id="questions"></div></section>
<section class="card"><h2>3. 確認・JSON出力</h2><div class="actions"><button type="button" class="secondary" id="validateBtn">内容をチェック</button><button type="button" class="secondary" id="previewBtn">JSONをプレビュー</button><button type="button" class="primary" id="downloadBtn">教材JSONを保存</button></div><div id="message" class="notice hidden"></div><pre id="preview" class="preview hidden"></pre><div class="small" style="margin-top:12px">保存したJSONをGitHubの <code>courses/</code> フォルダへ追加すると、v1.5のGitHub Actionsが検証し、正常なら <code>catalog.json</code> へ自動登録します。</div></section>
</main>
<script>
(function(){
'use strict';
function byId(id){return document.getElementById(id);}
function textValue(v){return String(v == null ? '' : v).trim();}
function showFatal(message){var box=byId('message');if(!box)return;box.className='notice error';box.innerHTML='<strong>教材作成画面のエラー</strong><br>'+String(message);}
window.addEventListener('error',function(e){showFatal(e.message || 'JavaScriptエラーが発生しました。');});
var seq=0;
function nextNumber(){var inputs=document.querySelectorAll('.question-card .number');var max=null;for(var i=0;i<inputs.length;i++){var n=Number(inputs[i].value);if(Number.isFinite(n)&&(max===null||n>max))max=n;}return max===null?(Number(byId('startNumber').value)||1):max+1;}
function renumber(){var cards=document.querySelectorAll('.question-card');for(var i=0;i<cards.length;i++){cards[i].querySelector('.qindex').textContent=String(i+1);}}
function createQuestion(seed){seed=seed||{};seq+=1;var wrap=document.createElement('div');wrap.className='question-card';wrap.setAttribute('data-qid',String(seq));var day=(seed.day == null ? 1 : seed.day);var number=(seed.number == null ? nextNumber() : seed.number);wrap.innerHTML='<div class="question-head"><strong>問題 <span class="qindex"></span></strong><button type="button" class="danger remove">この問題を削除</button></div>'+
'<div class="grid2"><div><label>章・区分</label><input class="day"></div><div><label>問題番号</label><input class="number" type="number" step="1"></div></div>'+
'<label>問題形式</label><select class="type"><option>四者択一</option><option>正誤判定</option><option>三者択一</option></select>'+
'<label>問題文</label><textarea class="question" placeholder="問題文を入力"></textarea>'+
'<div class="grid2">'+
'<div class="option-row"><div><label>キー</label><input class="optkey" value="A"></div><div><label>選択肢A</label><input class="opttext" placeholder="選択肢"></div></div>'+
'<div class="option-row"><div><label>キー</label><input class="optkey" value="B"></div><div><label>選択肢B</label><input class="opttext" placeholder="選択肢"></div></div>'+
'<div class="option-row"><div><label>キー</label><input class="optkey" value="C"></div><div><label>選択肢C</label><input class="opttext" placeholder="選択肢（不要なら空欄）"></div></div>'+
'<div class="option-row"><div><label>キー</label><input class="optkey" value="D"></div><div><label>選択肢D</label><input class="opttext" placeholder="選択肢（不要なら空欄）"></div></div>'+
'</div><label>正解</label><select class="answer"><option>A</option><option>B</option><option>C</option><option>D</option></select>'+
'<label>解説</label><textarea class="explanation" placeholder="正解・不正解の理由を入力"></textarea>';
wrap.querySelector('.day').value=String(day);wrap.querySelector('.number').value=String(number);wrap.querySelector('.type').value=seed.type||'四者択一';wrap.querySelector('.question').value=seed.question||'';wrap.querySelector('.explanation').value=seed.explanation||'';if(seed.options){var rows=wrap.querySelectorAll('.option-row');for(var j=0;j<seed.options.length&&j<rows.length;j++){rows[j].querySelector('.optkey').value=seed.options[j][0];rows[j].querySelector('.opttext').value=seed.options[j][1];}}wrap.querySelector('.answer').value=seed.answer||'A';wrap.querySelector('.remove').addEventListener('click',function(){wrap.parentNode.removeChild(wrap);renumber();});byId('questions').appendChild(wrap);renumber();}
function buildData(){var clear=Number(byId('clearCount').value);var cards=document.querySelectorAll('.question-card');var questions=[];for(var i=0;i<cards.length;i++){var el=cards[i];var rows=el.querySelectorAll('.option-row');var options=[];for(var j=0;j<rows.length;j++){var key=textValue(rows[j].querySelector('.optkey').value);var val=textValue(rows[j].querySelector('.opttext').value);if(key&&val)options.push([key,val]);}questions.push({day:textValue(el.querySelector('.day').value),number:Number(el.querySelector('.number').value),type:el.querySelector('.type').value,question:textValue(el.querySelector('.question').value),options:options,answer:textValue(el.querySelector('.answer').value),explanation:textValue(el.querySelector('.explanation').value)});}return{course_id:textValue(byId('courseId').value),title:textValue(byId('title').value),description:textValue(byId('description').value),subtitle:textValue(byId('subtitle').value),section_label:textValue(byId('sectionLabel').value)||'章',clear_count:clear,questions:questions};}
function validateData(data){var errors=[];if(!/^[A-Za-z0-9][A-Za-z0-9_-]*$/.test(data.course_id))errors.push('教材IDは英数字で始まり、英数字・ハイフン・アンダースコアだけを使用してください。');if(!data.title)errors.push('教材名を入力してください。');if(!Number.isInteger(data.clear_count)||data.clear_count<1)errors.push('クリア回数は1以上の整数にしてください。');if(!data.questions.length)errors.push('問題を1問以上追加してください。');var numbers={};for(var i=0;i<data.questions.length;i++){var q=data.questions[i];var n=i+1;if(!q.day)errors.push('問題'+n+': 章・区分を入力してください。');if(!Number.isInteger(q.number))errors.push('問題'+n+': 問題番号は整数にしてください。');else if(numbers[String(q.number)])errors.push('問題'+n+': 問題番号 '+q.number+' が重複しています。');else numbers[String(q.number)]=true;if(!q.question)errors.push('問題'+n+': 問題文を入力してください。');if(q.options.length<2)errors.push('問題'+n+': 選択肢を2個以上入力してください。');var keys={};for(var j=0;j<q.options.length;j++){if(keys[q.options[j][0]])errors.push('問題'+n+': 選択肢キーが重複しています。');keys[q.options[j][0]]=true;}if(!keys[q.answer])errors.push('問題'+n+': 正解「'+q.answer+'」に対応する選択肢がありません。');if(!q.explanation)errors.push('問題'+n+': 解説を入力してください。');}return errors;}
function showResult(errors,okText){var box=byId('message');box.className='notice '+(errors.length?'error':'ok');if(errors.length){box.innerHTML='<strong>修正が必要です</strong><br>・'+errors.join('<br>・');}else{box.innerHTML='<strong>'+(okText||'入力内容に問題はありません。')+'</strong>';}return errors.length===0;}
function checkedData(){var data=buildData();var errors=validateData(data);showResult(errors);return errors.length?null:data;}
function init(){byId('addQuestionBtn').addEventListener('click',function(){createQuestion();});byId('validateBtn').addEventListener('click',function(){checkedData();});byId('previewBtn').addEventListener('click',function(){var data=checkedData();var pre=byId('preview');if(!data){pre.className='preview hidden';return;}pre.textContent=JSON.stringify(data,null,2);pre.className='preview';});byId('downloadBtn').addEventListener('click',function(){var data=checkedData();if(!data)return;try{var blob=new Blob([JSON.stringify(data,null,2)+'\n'],{type:'application/json;charset=utf-8'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=data.course_id+'.json';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url);},1000);showResult([],data.course_id+'.json を作成しました。次にGitHubの courses/ へ追加してください。');}catch(e){showFatal(e.message||e);}});createQuestion();}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}
})();
</script></body></html>
