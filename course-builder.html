<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<title>教材作成アシスタント v1.6</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#1e2430;--muted:#667085;--border:#d8dee9;--accent:#2f6fed;--good:#147a3d;--bad:#b42318;--soft:#eef3ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Yu Gothic UI",sans-serif}.app{max-width:980px;margin:auto;padding:16px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:14px}h1{margin:0 0 8px;font-size:clamp(25px,3vw,34px)}h2{margin:0 0 14px}.sub,.small{color:var(--muted)}label{display:block;font-weight:800;margin:12px 0 6px}input,textarea,select,button{width:100%;border:1px solid var(--border);border-radius:12px;background:#fff;font:inherit;padding:11px 12px}textarea{min-height:92px;resize:vertical}button{min-height:48px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.secondary{background:var(--soft);color:#1849a9}.danger{color:var(--bad)}.good{color:var(--good)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.question-card{border:1px solid var(--border);border-radius:16px;padding:16px;margin-top:14px}.question-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.question-head button{width:auto;min-width:110px}.option-row{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:end}.notice{border-radius:14px;padding:12px 14px;margin:12px 0;background:#fff8e6;border:1px solid #f4d38a}.notice.ok{background:#edf9f0;border-color:#b7dfc3}.notice.error{background:#fff0ef;border-color:#efb5b0}.preview{white-space:pre;overflow:auto;max-height:420px;background:#111827;color:#f9fafb;border-radius:14px;padding:14px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px}.topbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.topbar a{color:#1849a9;font-weight:800;text-decoration:none}.pill{display:inline-block;background:var(--soft);color:#1849a9;border-radius:999px;padding:5px 10px;font-weight:800}.hidden{display:none}@media(max-width:720px){.grid2,.grid4,.actions{grid-template-columns:1fr}.option-row{grid-template-columns:54px 1fr}.question-head{align-items:flex-start;flex-direction:column}.question-head button{width:100%}}
</style>
</head>
<body><main class="app">
<div class="topbar"><a href="./">← 学習アプリへ戻る</a><span class="pill">v1.6</span></div>
<section class="card"><h1>教材作成アシスタント</h1><div class="sub">フォームへ入力すると、v1.5の自動登録機能で利用できる教材JSONを作成できます。入力内容はこのブラウザ内だけで処理し、サーバーへ送信しません。</div></section>
<section class="card"><h2>1. 教材情報</h2><div class="grid2"><div><label for="courseId">教材ID</label><input id="courseId" placeholder="例: accounting-basic-v1"><div class="small">英数字・ハイフン・アンダースコア。後から変更しない識別子です。</div></div><div><label for="title">教材名</label><input id="title" placeholder="例: 会計基礎"></div></div><label for="description">教材の説明</label><textarea id="description" placeholder="教材一覧に表示する説明"></textarea><div class="grid4"><div><label for="subtitle">サブタイトル</label><input id="subtitle" placeholder="基礎編"></div><div><label for="sectionLabel">区分名</label><input id="sectionLabel" value="章"></div><div><label for="clearCount">クリア回数</label><input id="clearCount" type="number" min="1" step="1" value="3"></div><div><label for="startNumber">開始番号</label><input id="startNumber" type="number" step="1" value="1"></div></div></section>
<section class="card"><div class="question-head"><h2>2. 問題</h2><button class="secondary" id="addQuestion">＋ 問題を追加</button></div><div id="questions"></div></section>
<section class="card"><h2>3. 確認・JSON出力</h2><div class="actions"><button class="secondary" id="validateBtn">内容をチェック</button><button class="secondary" id="previewBtn">JSONをプレビュー</button><button class="primary" id="downloadBtn">教材JSONを保存</button></div><div id="message" class="notice hidden"></div><pre id="preview" class="preview hidden"></pre><div class="small" style="margin-top:12px">保存したJSONをGitHubの <code>courses/</code> フォルダへ追加すると、v1.5のGitHub Actionsが検証し、正常なら <code>catalog.json</code> へ自動登録します。</div></section>
</main>
<script>
const $=id=>document.getElementById(id);let seq=0;
function esc(s){return String(s??'').trim()}
function addQuestion(seed={}){seq++;const wrap=document.createElement('div');wrap.className='question-card';wrap.dataset.qid=seq;wrap.innerHTML=`<div class="question-head"><strong>問題 <span class="qindex"></span></strong><button type="button" class="danger remove">この問題を削除</button></div><div class="grid2"><div><label>章・区分</label><input class="day" value="${seed.day??1}"></div><div><label>問題番号</label><input class="number" type="number" step="1" value="${seed.number??nextNumber()}"></div></div><label>問題形式</label><select class="type"><option>四者択一</option><option>正誤判定</option><option>三者択一</option></select><label>問題文</label><textarea class="question" placeholder="問題文を入力"></textarea><div class="grid2"><div class="option-row"><div><label>キー</label><input class="optkey" value="A"></div><div><label>選択肢A</label><input class="opttext" placeholder="選択肢"></div></div><div class="option-row"><div><label>キー</label><input class="optkey" value="B"></div><div><label>選択肢B</label><input class="opttext" placeholder="選択肢"></div></div><div class="option-row"><div><label>キー</label><input class="optkey" value="C"></div><div><label>選択肢C</label><input class="opttext" placeholder="選択肢（不要なら空欄）"></div></div><div class="option-row"><div><label>キー</label><input class="optkey" value="D"></div><div><label>選択肢D</label><input class="opttext" placeholder="選択肢（不要なら空欄）"></div></div></div><label>正解</label><select class="answer"><option>A</option><option>B</option><option>C</option><option>D</option></select><label>解説</label><textarea class="explanation" placeholder="正解・不正解の理由を入力"></textarea>`;wrap.querySelector('.type').value=seed.type||'四者択一';wrap.querySelector('.question').value=seed.question||'';wrap.querySelector('.explanation').value=seed.explanation||'';if(seed.options){const rows=wrap.querySelectorAll('.option-row');seed.options.forEach((o,i)=>{if(rows[i]){rows[i].querySelector('.optkey').value=o[0];rows[i].querySelector('.opttext').value=o[1]}})}wrap.querySelector('.answer').value=seed.answer||'A';wrap.querySelector('.remove').onclick=()=>{wrap.remove();renumber()};$('questions').append(wrap);renumber()}
function nextNumber(){const nums=[...document.querySelectorAll('.question-card .number')].map(x=>Number(x.value)).filter(Number.isFinite);return nums.length?Math.max(...nums)+1:Number($('startNumber').value)||1}
function renumber(){[...document.querySelectorAll('.question-card')].forEach((el,i)=>el.querySelector('.qindex').textContent=i+1)}
function build(){const clear=Number($('clearCount').value);return{course_id:esc($('courseId').value),title:esc($('title').value),description:esc($('description').value),subtitle:esc($('subtitle').value),section_label:esc($('sectionLabel').value)||'章',clear_count:clear,questions:[...document.querySelectorAll('.question-card')].map(el=>({day:esc(el.querySelector('.day').value),number:Number(el.querySelector('.number').value),type:el.querySelector('.type').value,question:esc(el.querySelector('.question').value),options:[...el.querySelectorAll('.option-row')].map(r=>[esc(r.querySelector('.optkey').value),esc(r.querySelector('.opttext').value)]).filter(o=>o[0]&&o[1]),answer:esc(el.querySelector('.answer').value),explanation:esc(el.querySelector('.explanation').value)}))}}
function validate(data){const errors=[];if(!/^[A-Za-z0-9][A-Za-z0-9_-]*$/.test(data.course_id))errors.push('教材IDは英数字で始まり、英数字・ハイフン・アンダースコアだけを使用してください。');if(!data.title)errors.push('教材名を入力してください。');if(!Number.isInteger(data.clear_count)||data.clear_count<1)errors.push('クリア回数は1以上の整数にしてください。');if(!data.questions.length)errors.push('問題を1問以上追加してください。');const numbers=new Set();data.questions.forEach((q,i)=>{const n=i+1;if(!q.day)errors.push(`問題${n}: 章・区分を入力してください。`);if(!Number.isInteger(q.number))errors.push(`問題${n}: 問題番号は整数にしてください。`);else if(numbers.has(String(q.number)))errors.push(`問題${n}: 問題番号 ${q.number} が重複しています。`);else numbers.add(String(q.number));if(!q.question)errors.push(`問題${n}: 問題文を入力してください。`);if(q.options.length<2)errors.push(`問題${n}: 選択肢を2個以上入力してください。`);const keys=q.options.map(o=>o[0]);if(new Set(keys).size!==keys.length)errors.push(`問題${n}: 選択肢キーが重複しています。`);if(!keys.includes(q.answer))errors.push(`問題${n}: 正解「${q.answer}」に対応する選択肢がありません。`);if(!q.explanation)errors.push(`問題${n}: 解説を入力してください。`)});return errors}
function show(errors,okText='入力内容に問題はありません。'){const m=$('message');m.classList.remove('hidden','ok','error');if(errors.length){m.classList.add('error');m.innerHTML='<strong>修正が必要です</strong><br>'+errors.map(x=>'・'+x).join('<br>')}else{m.classList.add('ok');m.innerHTML='<strong>'+okText+'</strong>'}return !errors.length}
function checkedData(){const d=build(),errors=validate(d);show(errors);return errors.length?null:d}
$('addQuestion').onclick=()=>addQuestion();$('validateBtn').onclick=()=>checkedData();$('previewBtn').onclick=()=>{const d=checkedData();if(!d){$('preview').classList.add('hidden');return}$('preview').textContent=JSON.stringify(d,null,2);$('preview').classList.remove('hidden')};$('downloadBtn').onclick=()=>{const d=checkedData();if(!d)return;const blob=new Blob([JSON.stringify(d,null,2)+'\n'],{type:'application/json;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=d.course_id+'.json';document.body.append(a);a.click();a.remove();URL.revokeObjectURL(a.href);show([],`${d.course_id}.json を作成しました。次にGitHubの courses/ へ追加してください。`)};
addQuestion();
</script></body></html>
