name: Update PWA to v1.11 stabilization
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v111-stabilization.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.11 patch
        run: python tools/v111_runner.py
      - name: Static checks
        run: |
          grep -q "PWA版 v1.11" index.html
          grep -q "教材作成アシスタント v1.11" course-builder.html
          grep -q "python-quiz-pwa-v1-11" service-worker.js
          grep -q "個人教材をバックアップ" index.html
          grep -q "v111-builder-stability" course-builder.html
      - name: Commit v1.11
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html course-builder.html service-worker.js README.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat: stabilize private courses before v2.0 [skip ci]"
          git push
