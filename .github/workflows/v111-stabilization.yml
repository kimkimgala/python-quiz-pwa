name: Update PWA to v1.11 stabilization
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v111-stabilization.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch v1.11
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # ---------- course-builder.html ----------
          p=Path('course-builder.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('教材作成アシスタント v1.10','教材作成アシスタント v1.11')
          s=s.replace('<span class="pill">v1.10</span>','<span class="pill">v1.11</span>')
          s=s.replace('作成した教材は原則としてこの端末だけに保存します。共有したい場合だけ、共有用JSONを書き出してGitHubへ登録します。入力内容はブラウザ内だけで処理します。','作成した教材は原則としてこの端末だけに保存します。v1.11では編集・上書き・ID衝突チェック・保存容量エラー対応を強化しました。共有したい場合だけ共有用JSONを書き出します。')

          # safe local save helpers inserted before DOMContentLoaded wiring
          marker="document.addEventListener('DOMContentLoaded',function(){"
          if marker not in s:
              raise SystemExit('builder DOMContentLoaded marker not found')
          helper=r'''var PRIVATE_COURSES_KEY='private_courses_v1';
          function loadPrivateMap(){try{var x=JSON.parse(localStorage.getItem(PRIVATE_COURSES_KEY));return x&&typeof x==='object'&&!Array.isArray(x)?x:{}}catch(e){return{}}}
          function quotaMessage(e){return e&&((e.name==='QuotaExceededError')||(e.code===22)||(e.code===1014))?'端末の保存容量が不足しています。不要な個人教材を削除するか、バックアップ後に整理してください。':String(e&&e.message?e.message:e)}
          function fillCourse(d){if(!d)return;byId('courseId').value=d.course_id||'';byId('title').value=d.title||'';byId('description').value=d.description||'';byId('category').value=d.category||'';byId('difficulty').value=d.difficulty||'';byId('audience').value=d.audience||'';byId('author').value=d.author||'';byId('courseVersion').value=d.version||'';byId('updatedAt').value=d.updated_at||'';byId('studyTime').value=d.study_time||'';byId('tags').value=Array.isArray(d.tags)?d.tags.join(','):'';byId('subtitle').value=d.subtitle||'';byId('sectionLabel').value=d.section_label||'章';byId('clearCount').value=d.clear_count||3;clearQ();for(var i=0;i<(d.questions||[]).length;i++)createQ(d.questions[i]);}
          function editId(){try{return new URLSearchParams(location.search).get('edit')||''}catch(e){return''}}
          async function sharedIds(){try{var r=await fetch('./catalog.json',{cache:'no-store'});if(!r.ok)return{};var d=await r.json(),o={};for(var i=0;i<(d.courses||[]).length;i++)o[String(d.courses[i].id)]=1;return o}catch(e){return{}}}
          async function saveLocalCourse(){var d=checked();if(!d)return;var shared=await sharedIds();if(shared[d.course_id]){show(['教材ID「'+d.course_id+'」は共有教材です。同じIDの個人教材は保存できません。別の教材IDにしてください。']);return}var map=loadPrivateMap(),editing=editId(),exists=!!map[d.course_id];if(exists&&editing!==d.course_id&&!confirm('同じ教材IDの個人教材が既にあります。上書きしますか？'))return;if(editing&&editing!==d.course_id&&map[editing]){if(!confirm('教材IDを変更すると旧IDの個人教材は削除されます。続けますか？'))return;delete map[editing]}map[d.course_id]=d;try{localStorage.setItem(PRIVATE_COURSES_KEY,JSON.stringify(map));var ids=[];try{ids=JSON.parse(localStorage.getItem('subscribed_courses_v1'))||[]}catch(e){}if(ids.indexOf(d.course_id)<0)ids.push(d.course_id);localStorage.setItem('subscribed_courses_v1',JSON.stringify(ids));show([],exists||editing?'個人教材を更新しました。学習成績は教材IDが同じ限り保持されます。':'個人教材として保存しました。GitHubには送信されません。');setTimeout(function(){location.href='./'},700)}catch(e){show([quotaMessage(e)])}}
          function prepareEdit(){var id=editId();if(!id)return;var d=loadPrivateMap()[id];if(!d){show(['編集対象の個人教材が見つかりません。']);return}fillCourse(d);byId('courseId').focus();}
          '''
          s=s.replace(marker,helper+marker,1)
          # Replace existing save local handler if present, otherwise wire it.
          s=re.sub(r"byId\('saveLocalBtn'\)\.addEventListener\('click',function\(\)\{.*?\}\);", "byId('saveLocalBtn').addEventListener('click',saveLocalCourse);", s, count=1)
          if "byId('saveLocalBtn').addEventListener('click',saveLocalCourse);" not in s:
              # insert after DOMContentLoaded open
              s=s.replace(marker,marker+"byId('saveLocalBtn').addEventListener('click',saveLocalCourse);",1)
          # ensure edit preload
          s=s.replace("createQ();", "createQ();prepareEdit();", 1)
          p.write_text(s,encoding='utf-8')

          # ---------- index.html ----------
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('PWA版 v1.10・個人教材・共有教材・カテゴリ・検索・教材作成・オフライン対応','PWA版 v1.11・安定化・個人教材編集・バックアップ・共有教材・オフライン対応')
          # add backup controls in manage bar
          old='<div class="managebar" style="gap:10px;flex-wrap:wrap"><button class="secondary" id="addCoursesBtn">教材を追加</button><button class="secondary" id="courseBuilderBtn">教材を作成</button></div>'
          new='<div class="managebar" style="gap:10px;flex-wrap:wrap"><button class="secondary" id="addCoursesBtn">教材を追加</button><button class="secondary" id="courseBuilderBtn">教材を作成</button><button class="secondary" id="backupPrivateBtn">個人教材をバックアップ</button><button class="secondary" id="restorePrivateBtn">個人教材を復元</button><input id="restorePrivateFile" type="file" accept="application/json,.json" class="hidden"></div>'
          if old not in s: raise SystemExit('managebar target missing')
          s=s.replace(old,new,1)
          # add helpers after loadPrivateCourses
          marker="function privateCourseEntries(){"
          helper=r'''function savePrivateCourses(map){try{localStorage.setItem(PRIVATE_COURSES_KEY,JSON.stringify(map));return true}catch(e){alert(e&&e.name==='QuotaExceededError'?'端末の保存容量が不足しています。バックアップ後に不要な個人教材を削除してください。':'個人教材を保存できませんでした。\n'+String(e));return false}}
function remoteCourseIds(){const ids=new Set();for(const c of CATALOG.courses||[]){if(!c.local)ids.add(String(c.id))}return ids}
function refreshCatalogWithPrivate(){const remote=(CATALOG.courses||[]).filter(c=>!c.local);CATALOG.courses=mergePrivateCourses(remote);renderCatalog()}
function deletePrivateCourse(id){const map=loadPrivateCourses();if(!map[id])return false;delete map[id];if(!savePrivateCourses(map))return false;unsubscribeCourse(id);localStorage.removeItem(progressKey(id));refreshCatalogWithPrivate();return true}
function downloadText(name,text){const blob=new Blob([text],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function backupPrivateCourses(){const map=loadPrivateCourses();const pkg={format:'python-quiz-private-backup',version:1,exported_at:new Date().toISOString(),courses:Object.values(map)};downloadText('private-courses-backup.json',JSON.stringify(pkg,null,2))}
async function restorePrivateCourses(file){let pkg;try{pkg=JSON.parse(await file.text())}catch(e){alert('バックアップJSONを読み込めませんでした。');return}if(!pkg||pkg.format!=='python-quiz-private-backup'||!Array.isArray(pkg.courses)){alert('このファイルは個人教材バックアップではありません。');return}const remote=remoteCourseIds(),map=loadPrivateCourses();for(const d of pkg.courses){if(!d||!d.course_id||!Array.isArray(d.questions)||!d.questions.length){alert('不正な教材データが含まれています。復元を中止しました。');return}if(remote.has(String(d.course_id))){alert('共有教材と同じID「'+d.course_id+'」が含まれるため復元できません。');return}}const dup=pkg.courses.filter(d=>map[d.course_id]).map(d=>d.course_id);if(dup.length&&!confirm('既存の個人教材 '+dup.join(', ')+' を上書きして復元しますか？'))return;for(const d of pkg.courses)map[d.course_id]=d;if(!savePrivateCourses(map))return;for(const d of pkg.courses)subscribeCourse(d.course_id);refreshCatalogWithPrivate();alert('個人教材を復元しました。')}
'''
          if marker not in s: raise SystemExit('private entry marker missing')
          s=s.replace(marker,helper+marker,1)
          # improve offline fallback in loadCatalog catch
          oldcatch="}catch(e){$('catalogTitle').textContent='教材一覧を読み込めません';$('courseGrid').textContent=String(e)}"
          newcatch="}catch(e){CATALOG={title:'マイ教材',courses:privateCourseEntries()};initializeSubscriptions();renderCatalog();if(!CATALOG.courses.length){$('catalogTitle').textContent='オフライン：共有教材一覧を取得できません';$('courseGrid').textContent='個人教材もありません。オンライン時に再度開いてください。'}}"
          if oldcatch not in s: raise SystemExit('loadCatalog catch target missing')
          s=s.replace(oldcatch,newcatch,1)
          # add edit/delete controls to local course cards
          old="const del=document.createElement('button');del.className='danger';del.textContent='教材管理';del.onclick=()=>openDelete(c);\nactions.append(learn,del);card.append(h,p,meta,actions);g.append(card);"
          new="if(c.local){const edit=document.createElement('button');edit.className='secondary';edit.textContent='編集';edit.onclick=()=>{location.href='./course-builder.html?edit='+encodeURIComponent(c.id)};const erase=document.createElement('button');erase.className='danger';erase.textContent='完全削除';erase.onclick=()=>{if(confirm('個人教材「'+(c.title||c.id)+'」と学習成績をこの端末から完全に削除しますか？'))deletePrivateCourse(c.id)};actions.append(learn,edit,erase)}else{const del=document.createElement('button');del.className='danger';del.textContent='教材管理';del.onclick=()=>openDelete(c);actions.append(learn,del)}card.append(h,p,meta,actions);g.append(card);"
          if old not in s: raise SystemExit('course card actions target missing')
          s=s.replace(old,new,1)
          # prevent private/remote id ambiguity if remote appears later: remote wins and flag private conflict by hiding it. Existing merge already remote wins.
          # wire backup/restore buttons near existing builder wiring
          wire="$('courseBuilderBtn').onclick=()=>location.href='./course-builder.html';"
          if wire not in s: raise SystemExit('builder wire missing')
          s=s.replace(wire,wire+"\n$('backupPrivateBtn').onclick=backupPrivateCourses;\n$('restorePrivateBtn').onclick=()=>$('restorePrivateFile').click();\n$('restorePrivateFile').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(f)await restorePrivateCourses(f);e.target.value=''});",1)
          p.write_text(s,encoding='utf-8')

          # ---------- service worker ----------
          p=Path('service-worker.js');s=p.read_text(encoding='utf-8')
          s=re.sub(r"const CACHE_NAME='python-quiz-pwa-v1-[^']+';","const CACHE_NAME='python-quiz-pwa-v1-11';",s,count=1)
          # network-first HTML/navigation to avoid stale app shell; JSON remains network-first, assets cache-first
          old="  if(u.origin===location.origin&&u.pathname.endsWith('.json')){"
          new="  if(e.request.mode==='navigate'||(u.origin===location.origin&&u.pathname.endsWith('.html'))){e.respondWith(fetch(e.request).then(r=>{if(r.ok){const copy=r.clone();caches.open(CACHE_NAME).then(c=>c.put(e.request,copy));}return r}).catch(()=>caches.match(e.request).then(x=>x||caches.match('./index.html'))));return;}\n  if(u.origin===location.origin&&u.pathname.endsWith('.json')){"
          if old not in s: raise SystemExit('service worker target missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # ---------- README ----------
          p=Path('README.md');s=p.read_text(encoding='utf-8')
          s=re.sub(r'^# Python Quiz PWA v1\.\d+','# Python Quiz PWA v1.11',s,count=1,flags=re.M)
          note='''\n## v1.11 v2.0前安定化\n\n- 個人教材の編集・上書き保存・完全削除\n- 共有教材との教材ID衝突を保存時に拒否\n- 個人教材の一括バックアップ／復元\n- localStorage容量不足時の明示エラー\n- オフラインで共有カタログが取得できない場合も個人教材を利用可能\n- HTMLナビゲーションをネットワーク優先にして旧版画面の残留を抑制\n\n''' 
          if '## v1.11 v2.0前安定化' not in s:
              pos=s.find('\n',s.find('\n')+1);s=s[:pos+1]+note+s[pos+1:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Basic static checks
        run: |
          grep -q "PWA版 v1.11" index.html
          grep -q "教材作成アシスタント v1.11" course-builder.html
          grep -q "python-quiz-pwa-v1-11" service-worker.js
          grep -q "個人教材をバックアップ" index.html
          grep -q "saveLocalCourse" course-builder.html
      - name: Commit v1.11
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html course-builder.html service-worker.js README.md
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "feat: stabilize private courses before v2.0 [skip ci]"
          git push
