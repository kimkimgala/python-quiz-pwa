name: Visual polish
on:
  push:
    branches: [ui-v2/visual-polish]
    paths:
      - tools/visual_polish_patch.py
      - .github/workflows/visual-polish.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-v2/visual-polish
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply visual polish
        run: python tools/visual_polish_patch.py
      - name: Validate structure and scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          for token in ['courseManageModal','course-card-bottom','この教材を学ぶ','管理','UI polish: card compactness']:
              assert token in s, token
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.S)
          for i,body in enumerate(scripts):
              Path(f'/tmp/index-{i}.js').write_text(body,encoding='utf-8')
          print('scripts',len(scripts))
          PY
          for f in /tmp/index-*.js; do node --check "$f"; done
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Polish course cards and management modal"
          git push
      - name: Remove temporary patch files
        run: |
          git rm tools/visual_polish_patch.py .github/workflows/visual-polish.yml
          git commit -m "chore: remove visual polish helpers"
          git push