name: Card style unification
on:
  push:
    branches: [ui-v2/card-style-unification]
    paths:
      - tools/card_style_unification_patch.py
      - .github/workflows/card-style-unification.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-v2/card-style-unification
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply card style patch
        run: python tools/card_style_unification_patch.py
      - name: Validate HTML and JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          required=[
            'course-card-bottom','courseManageModal','courseManageActions',
            "manage.textContent='管理'",'function openCourseManage(course)',
            "addManageAction('教材を編集する'", "addManageAction('共有用JSONを書き出す'",
            "addManageAction('この端末から削除する'", "addManageAction('学習履歴をリセット'",
            "addManageAction('マイ教材から外す'"
          ]
          for x in required: assert x in s, x
          assert "edit.textContent='編集'" not in s
          assert "erase.textContent='削除'" not in s
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.S)
          assert scripts
          for i,body in enumerate(scripts):
              Path(f'/tmp/index-{i}.js').write_text(body,encoding='utf-8')
          print('scripts',len(scripts))
          PY
          for f in /tmp/index-*.js; do node --check "$f"; done
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Unify course card layout and management actions"
          git push
      - name: Remove temporary patch files
        run: |
          git rm tools/card_style_unification_patch.py .github/workflows/card-style-unification.yml
          git commit -m "chore: remove card style patch helpers"
          git push
