name: Update selected app icon
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-app-icon.yml
permissions:
  contents: write
jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render selected icon
        run: |
          python -m pip install 'CairoSVG==2.7.1' 'Pillow==11.1.0'
          python - <<'PY'
          from pathlib import Path
          import io
          import cairosvg
          from PIL import Image
          source = Path('assets/app-icon.svg').read_bytes()
          for size in (192, 512):
              data = cairosvg.svg2png(bytestring=source, output_width=size, output_height=size)
              image = Image.open(io.BytesIO(data))
              assert image.size == (size, size)
              assert image.getbbox() is not None
              Path(f'icon-{size}.png').write_bytes(data)
          print('Icon dimensions verified: 192x192, 512x512')
          PY
      - name: Refresh icon references and cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p = Path('service-worker.js')
          s = p.read_text(encoding='utf-8')
          assert "python-quiz-pwa-v1-11" in s
          p.write_text(s.replace('python-quiz-pwa-v1-11', 'python-quiz-pwa-v1-11-icon1', 1), encoding='utf-8')
          p = Path('manifest.json')
          m = json.loads(p.read_text(encoding='utf-8'))
          for icon in m['icons']:
              icon['src'] = icon['src'].split('?')[0] + '?v=card-check-1'
              icon['purpose'] = 'any'
          p.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          assert 'href="icon-192.png"' in s
          p.write_text(s.replace('href="icon-192.png"', 'href="icon-192.png?v=card-check-1"', 1), encoding='utf-8')
          PY
      - name: Commit icon assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png manifest.json index.html service-worker.js
          git commit -m "feat: replace Py icon with card and check [skip ci]"
          git push
