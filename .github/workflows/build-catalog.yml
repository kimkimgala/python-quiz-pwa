name: Build course catalog

on:
  push:
    branches: [main]
    paths:
      - "questions.json"
      - "courses/**/*.json"
      - "tools/build_catalog.py"
      - ".github/workflows/build-catalog.yml"
  pull_request:
    branches: [main]
    paths:
      - "questions.json"
      - "courses/**/*.json"
      - "tools/build_catalog.py"
      - ".github/workflows/build-catalog.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate courses and build catalog
        run: python tools/build_catalog.py

      - name: Verify catalog is up to date on pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- catalog.json

      - name: Commit generated catalog on main
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- catalog.json; then
            echo "catalog.json is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "chore: rebuild course catalog [skip ci]"
          git push
