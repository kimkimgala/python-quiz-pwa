name: Bust OS app icon cache
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/icon-cache-bust-v2.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icon-cache-bust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate new icon filenames
        run: |
          python -m pip install 'CairoSVG==2.7.1' 'Pillow==11.1.0'
          python - <<'PY'
          from pathlib import Path
          import io, cairosvg
          from PIL import Image
          source = Path('assets/app-icon.svg').read_bytes()
          for size in (192, 512):
              out = Path(f'app-icon-card-check-{size}-v2.png')
              data = cairosvg.svg2png(bytestring=source, output_width=size, output_height=size)
              im = Image.open(io.BytesIO(data))
              assert im.size == (size, size)
              out.write_bytes(data)
          PY
      - name: Point manifest and HTML to new icon filenames
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          p=Path('manifest.json')
          m=json.loads(p.read_text(encoding='utf-8'))
          for icon in m.get('icons',[]):
              if icon.get('sizes')=='192x192': icon['src']='app-icon-card-check-192-v2.png'
              if icon.get('sizes')=='512x512': icon['src']='app-icon-card-check-512-v2.png'
              icon['purpose']='any'
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<link rel="apple-touch-icon" href="[^"]+">','<link rel="apple-touch-icon" href="app-icon-card-check-192-v2.png">',s,count=1)
          p.write_text(s,encoding='utf-8')
          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"const CACHE_NAME='[^']+';","const CACHE_NAME='python-quiz-pwa-v1-11-icon2';",s,count=1)
          s=s.replace("'./icon-192.png','./icon-512.png'","'./app-icon-card-check-192-v2.png','./app-icon-card-check-512-v2.png'")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          python - <<'PY'
          from PIL import Image
          for size in (192,512):
              p=f'app-icon-card-check-{size}-v2.png'
              assert Image.open(p).size==(size,size)
          PY
          grep -q 'app-icon-card-check-192-v2.png' manifest.json
          grep -q 'app-icon-card-check-512-v2.png' manifest.json
          grep -q 'python-quiz-pwa-v1-11-icon2' service-worker.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-icon-card-check-192-v2.png app-icon-card-check-512-v2.png manifest.json index.html service-worker.js
          git commit -m "fix: bust OS icon cache with new filenames [skip ci]"
          git push
