name: Card style mobile fix
on:
  push:
    branches: [ui-v2/card-style-unification]
    paths:
      - tools/card_style_mobile_fix.py
      - .github/workflows/card-style-mobile-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-v2/card-style-unification
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply mobile fix
        run: python tools/card_style_mobile_fix.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert '.home-shell .cardactions{grid-template-columns:minmax(0,1fr) 76px}.home-bottom-nav' in s
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.S)
          for i,body in enumerate(scripts): Path(f'/tmp/index-{i}.js').write_text(body,encoding='utf-8')
          PY
          for f in /tmp/index-*.js; do node --check "$f"; done
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Keep course card action width aligned on mobile"
          git push
      - name: Remove temporary helpers
        run: |
          git rm tools/card_style_mobile_fix.py .github/workflows/card-style-mobile-fix.yml
          git commit -m "chore: remove mobile card fix helpers"
          git push
