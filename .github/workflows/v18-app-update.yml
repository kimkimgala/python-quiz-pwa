name: Update PWA to v1.8
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v18-app-update.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-v18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch v1.8
        run: python tools/patch_v18.py
      - name: Verify Python syntax
        run: python -m py_compile tools/build_catalog.py
      - name: Rebuild catalog
        run: python tools/build_catalog.py
      - name: Commit v1.8
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/build_catalog.py course-builder.html index.html service-worker.js README.md catalog.json
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "feat: add v1.8 course categories and search [skip ci]"
          git push
