name: Phase UI-3 patch

on:
  push:
    branches:
      - ui-v2/phase-ui-3-settings

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-v2/phase-ui-3-settings
      - name: Apply Phase UI-3 patch
        run: python tools/phase_ui3_patch.py
      - name: Syntax check inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/app.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Verify key UI-3 elements
        run: |
          grep -q 'id="studySetup"' index.html
          grep -q 'data-study-style="continue"' index.html
          grep -q 'data-study-style="review"' index.html
          grep -q 'data-study-style="mock"' index.html
          grep -q 'id="questionLimit"' index.html
          grep -q 'function beginStudy' index.html
      - name: Commit patched app and remove temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/phase_ui3_patch.py .github/workflows/phase-ui3-patch.yml
          git add index.html
          git commit -m "Implement Phase UI-3 study settings"
          git push origin HEAD:ui-v2/phase-ui-3-settings
