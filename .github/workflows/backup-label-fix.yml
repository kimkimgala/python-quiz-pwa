name: Backup label fix
on:
  push:
    branches: [ui-v2/visual-polish]
    paths: ['.github/workflows/backup-label-fix.yml','tools/backup_label_fix.py']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-v2/visual-polish
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/backup_label_fix.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: improve backup button line break" || exit 0
          git push
