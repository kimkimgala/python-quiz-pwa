name: Phase UI-3 follow-up fix

on:
  push:
    branches:
      - ui-v2/phase-ui-3-settings

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-v2/phase-ui-3-settings
      - name: Apply follow-up fix
        run: python tools/phase_ui3_fix.py
      - name: Syntax check inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/app.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit fix and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/phase_ui3_fix.py .github/workflows/phase-ui3-fix.yml
          git add index.html
          git commit -m "Refine Phase UI-3 settings state"
          git push origin HEAD:ui-v2/phase-ui-3-settings
